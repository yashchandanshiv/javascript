<!DOCTYPE html>
<html>
<head>
    <title>Array Operations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Array Operations</h2>

    <input type="number" id="size" placeholder="Enter array size">
    <button onclick="createArray()">Create Array</button>

    <p id="result"></p>

    <input type="text" id="value" placeholder="Enter array element">
    <button onclick="addElement()">Add Element</button>

    <p id="array"></p>

    <input type="text" id="obj" placeholder="Enter object or array">
    <button onclick="appendObject()">Append Object</button>

    <p id="check"></p>
    <p id="current"></p>

    <script src="script.js"></script>

</body>
</html>
