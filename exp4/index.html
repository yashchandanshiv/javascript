
<!DOCTYPE html>
<html>
<head>
    <title>String Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>String Comparison in JavaScript</h2>

    <input type="text" id="str1" placeholder="Enter String 1">
    <br>

    <input type="text" id="str2" placeholder="Enter String 2">
    <br>

    <button onclick="compareStrict()">Compare using ===</button>
    <p id="result1"></p>

    <button onclick="compareLoose()">Compare using ==</button>
    <p id="result2"></p>

    <button onclick="compareLocale()">Compare using localeCompare()</button>
    <p id="result3"></p>

    <button onclick="compareRegex()">Compare using RegExp</button>
    <p id="result4"></p>

    <button onclick="reset()">Reset</button>

    <script src="script.js"></script>
</body>
</html>
