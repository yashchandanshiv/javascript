<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer</title>
  </head>

  <body>
    <h1>Countdown Timer</h1>

    <label>Enter End Date and Time:</label>
    <br /><br />

    <input type="datetime-local" id="endDate" />

    <button onclick="startTimer()">Start Timer</button>

    <h2 id="result"></h2>

    <script>
      function startTimer() {
        // Get the end date
        let endDate = document.getElementById("endDate").value;

        // Convert end date into timestamp
        let deadline = new Date(endDate).getTime();

        if (endDate === "" || isNaN(deadline)) {
          document.getElementById("result").innerHTML =
            "Please enter a valid date and time";
          return;
        }

        // Update timer every second
        let timer = setInterval(function () {
          // Get current time
          let currentTime = new Date().getTime();

          // Calculate remaining time
          let remainingTime = deadline - currentTime;

          if (remainingTime <= 0) {
            clearInterval(timer);

            document.getElementById("result").innerHTML = "Countdown Expired!";

            return;
          }

          // Calculate days, hours, minutes and seconds
          let days = Math.floor(remainingTime / (1000 * 60 * 60 * 24));

          let hours = Math.floor(
            (remainingTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
          );

          let minutes = Math.floor(
            (remainingTime % (1000 * 60 * 60)) / (1000 * 60),
          );

          let seconds = Math.floor((remainingTime % (1000 * 60)) / 1000);

          // Display result
          document.getElementById("result").innerHTML =
            days +
            " Days : " +
            hours +
            " Hours : " +
            minutes +
            " Minutes : " +
            seconds +
            " Seconds";
        }, 1000);
      }
    </script>
  </body>
</html>
